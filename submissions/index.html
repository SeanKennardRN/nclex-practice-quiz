<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Submissions | Nurse Acumen</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--navy:#043E7D;--blue:#046EC4;--orange:#FF914D}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#1a2733;font:14px 'Open Sans',sans-serif}.brand{background:var(--navy);color:white;text-align:center;padding:13px;font:600 15px Montserrat}.brand span{color:var(--orange)}main{max-width:1250px;margin:auto;padding:28px 18px}h1,h2{font-family:Montserrat;color:var(--navy)}h1{margin:0 0 5px;font-size:25px}.muted{color:#647487}.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 10px #043e7d15;margin:16px 0}.login{max-width:430px;margin:75px auto;border-top:6px solid var(--orange)}input,select,button{font:inherit;padding:10px;border:1px solid #c8d3df;border-radius:8px}input,select{background:white;min-width:0}button{background:var(--navy);color:white;cursor:pointer;border:0;font-weight:700}button.secondary{background:white;color:var(--navy);border:1px solid #b5c5d6}button:disabled{opacity:.6}.login input,.login button{width:100%;margin:6px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input{flex:2;min-width:170px}.toolbar select{flex:1;min-width:135px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats .card{margin:12px 0}.number{font:700 27px Montserrat;color:var(--navy)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:11px 13px;border-bottom:1px solid #e7edf3;text-align:left}th{background:#edf3f9;color:var(--navy);font:700 12px Montserrat;position:sticky;top:0}th button{background:none;color:inherit;padding:0}tr:hover td{background:#f8fbff}.good{color:#137c51;font-weight:bold}.bad{color:#b02a37;font-weight:bold}.hidden{display:none!important}.cols{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}.cols label{white-space:nowrap}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button.active{background:var(--orange)}.small{font-size:12px}.notice{color:#a1222b}.pill{display:inline-block;background:#eaf2fa;padding:3px 8px;border-radius:15px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.toolbar>*{width:100%}}
</style></head><body><div class="brand">Nurse Acumen <span>Coaching</span></div><main><section id="login" class="card login"><h2>Administrator Sign In</h2><p class="muted">Private member submission records. Authorized administrators only.</p><form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="Admin email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Sign In</button></form><p id="loginError" class="notice" role="alert"></p></section><section id="app" class="hidden"><div class="toolbar" style="justify-content:space-between"><div><h1>Member Submissions</h1><div class="muted">NGN QBank · Administrator Dashboard</div></div><button class="secondary" id="logout">Sign Out</button></div><div class="stats"><div class="card"><div class="muted">Attempts</div><div class="number" id="attemptCount">0</div></div><div class="card"><div class="muted">Average Score</div><div class="number" id="avg">—</div></div><div class="card"><div class="muted">Members</div><div class="number" id="members">0</div></div></div><div class="tabs"><button id="overviewTab" class="active">Submissions</button><button id="detailsTab" class="secondary">Question Details</button></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search member, email, attempt ID..."><select id="memberFilter"><option value="">All Members</option></select><select id="quizFilter"><option value="">All Tests</option></select><select id="sort"><option value="dateDesc">Newest First</option><option value="dateAsc">Oldest First</option><option value="scoreDesc">Highest Score</option><option value="scoreAsc">Lowest Score</option><option value="member">Member Name</option></select><button class="secondary" id="export">Export CSV</button></div><details><summary style="margin-top:15px;cursor:pointer">Show / Hide Columns</summary><div id="columns" class="cols"></div></details><div class="tablewrap" style="margin-top:15px"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><p id="count" class="muted small"></p></div></section></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const base='https://lkthfijagdxdqjaqclky.supabase.co',client=createClient(base,'sb_publishable_Dm8SEw814HaX3MGKuCUZHQ_Md7g6m6h'),endpoint=base+'/functions/v1/quiz-admin-submissions';
const $=id=>document.getElementById(id);let attempts=[],responses=[],view='overview',chosen='',sortCol='',sortDir=1;
const fields={member:'Member',email:'Email',quiz:'Test',date:'Completed',score:'Score',correct:'Correct',total:'Total',id:'Attempt ID',contact:'Contact ID'};
let visible=JSON.parse(localStorage.getItem('nacSubmissionColumns')||'null')||['member','quiz','date','score','correct','total'];
const safe=v=>String(v??'');const esc=v=>safe(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rows(){let q=$('search').value.toLowerCase(),m=$('memberFilter').value,t=$('quizFilter').value;let a=attempts.filter(x=>(!m||x.email===m)&&(!t||x.quiz_set===t)&&[x.full_name,x.email,x.id,x.submission_id,x.contact_id].some(v=>safe(v).toLowerCase().includes(q)));let s=$('sort').value;a.sort((x,y)=>s==='scoreDesc'?Number(y.percentage)-Number(x.percentage):s==='scoreAsc'?Number(x.percentage)-Number(y.percentage):s==='dateAsc'?new Date(x.submitted_at)-new Date(y.submitted_at):s==='member'?safe(x.full_name).localeCompare(safe(y.full_name)):new Date(y.submitted_at)-new Date(x.submitted_at));return a}
function format(x,k){switch(k){case'member':return x.full_name||x.email;case'quiz':return x.quiz_set;case'date':return new Date(x.submitted_at).toLocaleString();case'score':return Number(x.percentage).toFixed(1)+'%';case'correct':return x.score;case'total':return x.total;case'id':return x.submission_id||x.id;case'contact':return x.contact_id;default:return x[k]}}
function csv(data){let content=data.map(row=>row.map(v=>'"'+safe(v).replace(/"/g,'""').replace(/^[=+@\-\t\r]/,'\'$&')+'"').join(',')).join('\r\n');let blob=new Blob([content],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nac-member-submissions.csv';a.click();URL.revokeObjectURL(a.href)}
function render(){let a=rows(),all=attempts;$('attemptCount').textContent=all.length;$('avg').textContent=all.length?(all.reduce((s,x)=>s+Number(x.percentage||0),0)/all.length).toFixed(1)+'%':'—';$('members').textContent=new Set(all.map(x=>x.email)).size;$('overviewTab').className=view==='overview'?'active':'secondary';$('detailsTab').className=view==='details'?'active':'secondary';let headers=view==='overview'?visible:['member','quiz','date','id','item','type','selected','answer','result'];$('thead').innerHTML='<tr>'+headers.map(k=>'<th>'+esc(fields[k]||({item:'Question ID',type:'Type',selected:'Chosen Answers',answer:'Correct Answers',result:'Result'}[k]))+'</th>').join('')+(view==='overview'?'<th>Review</th>':'')+'</tr>';let list=view==='overview'?a:a.flatMap(x=>responses.filter(r=>r.attempt_id===x.id).map(r=>({x,r})));if(view==='details'&&chosen)list=list.filter(v=>v.x.id===chosen);$('tbody').innerHTML=list.map(v=>{if(view==='overview'){return '<tr>'+visible.map(k=>'<td>'+esc(format(v,k))+'</td>').join('')+'<td><button class="secondary review" data-id="'+esc(v.id)+'">View Answers</button></td></tr>'}let x=v.x,r=v.r;return '<tr>'+[x.full_name||x.email,x.quiz_set,new Date(x.submitted_at).toLocaleString(),x.submission_id||x.id,r.item_id,r.question_type||'—',(r.selected||[]).join(', '),(r.correct||[]).join(', '),r.is_correct?'Correct':'Incorrect'].map((val,i)=>'<td'+(i===8?' class="'+(r.is_correct?'good':'bad')+'"':'')+'>'+esc(val)+'</td>').join('')+'</tr>'}).join('');$('count').textContent=list.length+' records shown';document.querySelectorAll('.review').forEach(b=>b.onclick=()=>{chosen=b.dataset.id;view='details';render()})}
function filters(){let mem=[...new Map(attempts.map(x=>[x.email,x.full_name||x.email])).entries()];$('memberFilter').innerHTML='<option value="">All Members</option>'+mem.map(([e,n])=>'<option value="'+esc(e)+'">'+esc(n)+'</option>').join('');$('quizFilter').innerHTML='<option value="">All Tests</option>'+[...new Set(attempts.map(x=>x.quiz_set))].map(t=>'<option>'+esc(t)+'</option>').join('');$('columns').innerHTML=Object.entries(fields).map(([k,label])=>'<label><input type="checkbox" data-col="'+k+'" '+(visible.includes(k)?'checked':'')+'> '+label+'</label>').join('');$('columns').querySelectorAll('input').forEach(el=>el.onchange=()=>{visible=el.checked?[...visible,el.dataset.col]:visible.filter(k=>k!==el.dataset.col);localStorage.setItem('nacSubmissionColumns',JSON.stringify(visible));render()})}
async function load(){const {data:{session}}=await client.auth.getSession();if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}try{const r=await fetch(endpoint,{headers:{Authorization:'Bearer '+session.access_token,apikey:'sb_publishable_Dm8SEw814HaX3MGKuCUZHQ_Md7g6m6h'}});const data=await r.json();if(!r.ok)throw Error(data.error||'Access denied');attempts=data.attempts||[];responses=data.responses||[];$('login').classList.add('hidden');$('app').classList.remove('hidden');filters();render()}catch(e){$('loginError').textContent=e.message;$('login').classList.remove('hidden');$('app').classList.add('hidden')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const{error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginError').textContent=error.message;return}await load()};
$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};$('overviewTab').onclick=()=>{view='overview';chosen='';render()};$('detailsTab').onclick=()=>{view='details';chosen='';render()};['search','memberFilter','quizFilter','sort'].forEach(k=>$(k).addEventListener(k==='search'?'input':'change',render));$('export').onclick=()=>{let a=rows();csv(view==='overview'?[Object.values(fields),...a.map(x=>Object.keys(fields).map(k=>format(x,k)))]:[['Member','Test','Date','Attempt ID','Question ID','Type','Chosen','Correct','Result'],...a.flatMap(x=>responses.filter(r=>r.attempt_id===x.id&&(!chosen||x.id===chosen)).map(r=>[x.full_name||x.email,x.quiz_set,x.submitted_at,x.submission_id||x.id,r.item_id,r.question_type,(r.selected||[]).join(';'),(r.correct||[]).join(';'),r.is_correct?'Correct':'Incorrect']))])};load();
</script></body></html>
